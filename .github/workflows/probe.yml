name: Probe broken sources

# SQLink and One1 answer from a GitHub runner and not from anywhere else a fix
# can be written, so the probe runs here and prints what the pages return today.
# Manual only, read-only, and it notifies nobody.
on:
  workflow_dispatch:
    inputs:
      which:
        description: 'sqlink, one1, or both (space separated)'
        required: false
        default: 'sqlink one1'
      sample:
        description: 'instead, print what one source returns raw: "<source> <role>"'
        required: false
        default: ''
      gates:
        description: 'instead, run every filter over one source and print who dropped what'
        required: false
        default: ''
      fingerprint:
        description: 'instead, try several browser fingerprints against one url and print the status of each'
        required: false
        default: ''
      browser:
        description: 'instead, open one url in a real Chromium and print what it gets'
        required: false
        default: ''
      atsreport:
        description: 'instead, print how many postings each ATS board has and how many are in Israel. any value turns it on'
        required: false
        default: ''
      peek:
        description: 'instead, fetch one url and print its status, size, head, and how many <loc> or job links it holds'
        required: false
        default: ''

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # מדפיס מה מקור מחזיר לפני כל שער. GotFriends ו-Nisha נראים כמו מקור
      # שעובד ומחזירים שורות, וכל אחת מהן נופלת בשער התחום.
      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml curl_cffi playwright tzdata

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # 14.11.2026. רשימות הטוקנים של Greenhouse, Lever, Ashby ו-SmartRecruiters
      # נכתבות מהראש, וטוקן שגוי נראה בדיוק כמו לוח ריק: שניהם מחזירים אפס
      # דרך הסורק. הצעד הזה מפריד ביניהם לפני שמשאירים טוקן ברשימה.
      - name: ATS board report
        if: inputs.atsreport != ''
        run: |
          set -o pipefail
          python run_notify.py atsreport 2>&1 | tee ats.txt || true
          {
            echo '## ATS boards'
            echo '```'
            cat ats.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sample one source
        if: inputs.sample != '' && inputs.gates == ''
        env:
          SAMPLE: ${{ inputs.sample }}
        run: |
          set -o pipefail
          python run_notify.py sample $SAMPLE 2>&1 | tee sample.txt || true
          {
            echo '## Sample'
            echo '```'
            cat sample.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 14.11.2026. מלם־תים הפסיק להביא משרות ב-1.11 ומחזיר מהראנר
      # HTTP 403 עם "Just a moment...", כלומר Cloudflare. כל הסקרייפרים
      # מתחזים ל-chrome124, שהוא כרום מאפריל 2024, ו-Cloudflare מהדקת את
      # הטביעה מול דפדפנים ישנים. הצעד הזה בודק אם טביעה עדכנית עוברת,
      # לפני שמחזירים מקור למחשב של שאול בניגוד להעדפה שלו.
      # 15.11.2026. פעמיים באותו יום הייתי צריך לדעת מה כתובת מחזירה בפועל
      # מהראנר, ולא רק אם היא עונה. טביעות הדפדפן אומרות 200 או 403, ולא
      # מה יש בפנים, ולכן לא היה אפשר לדעת אם סייטמאפ ניתן לפריסה בלי
      # לנחש. הצעד הזה מדפיס את הראש ואת הספירות.
      - name: Peek at one url
        if: inputs.peek != ''
        env:
          TARGET: ${{ inputs.peek }}
        run: |
          python - <<'EOF'
          import os, re
          from curl_cffi import requests as cf
          url = os.environ['TARGET']
          r = cf.get(url, impersonate='chrome136', timeout=60)
          body = r.text
          print(f'HTTP {r.status_code}  {len(r.content)} bytes  '
                f'{r.headers.get("content-type", "")}')
          locs = re.findall(r'<loc>\s*([^<\s]+)\s*</loc>', body)
          print(f'<loc> entries: {len(locs)}')
          for u in locs[:12]:
              print('  ' + u)
          hrefs = re.findall(r'href="([^"]+)"', body)
          jobs = [h for h in hrefs if '/jobs/' in h]
          print(f'href links: {len(hrefs)}, of them /jobs/: {len(jobs)}')
          for u in jobs[:12]:
              print('  ' + u)
          print('--- first 600 chars ---')
          print(body[:600])
          # חלון סביב כרטיס המשרה הראשון. בלי לראות את הסימון עצמו אי
          # אפשר לכתוב פרסר, ורק שמות הקישורים אינם מספיקים.
          m = re.search(r'href="[^"]*/jobs/[0-9A-Za-z_.]+-(?:in|id|dr|aj|jk|vip|emp)"', body)
          if m:
              a, b = max(0, m.start() - 1400), m.end() + 1400
              print('--- around the first job card ---')
              print(body[a:b])
          EOF

      - name: Try browser fingerprints against one url
        if: inputs.fingerprint != ''
        env:
          TARGET: ${{ inputs.fingerprint }}
        run: |
          python - <<'EOF'
          import os
          from curl_cffi import requests as cf
          url = os.environ['TARGET']
          try:
              from curl_cffi.requests.impersonate import BrowserTypeLiteral
              print('available:', BrowserTypeLiteral)
          except Exception:
              pass
          for target in ['chrome124', 'chrome131', 'chrome133a', 'chrome136',
                         'chrome', 'safari18_0', 'firefox135']:
              try:
                  r = cf.get(url, impersonate=target, timeout=60)
                  title = ''
                  if 'text/html' in r.headers.get('content-type', ''):
                      body = r.text[:4000]
                      i = body.lower().find('<title')
                      if i >= 0:
                          j = body.find('>', i); k = body.lower().find('</title', j)
                          title = body[j+1:k].strip()[:50]
                  print(f'{target:14} HTTP {r.status_code}  {len(r.content):>9} bytes  {title}')
              except Exception as e:
                  print(f'{target:14} failed: {str(e)[:90]}')
          EOF

      # 14.11.2026. "Just a moment..." הוא דף אתגר JavaScript ולא חסימת
      # כתובת: אותו 403 חזר גם מהמחשב של שאול, בחיבור ביתי. כלומר השאלה
      # אינה מאיפה הבקשה יוצאת אלא שהיא לא דפדפן אמיתי. הצעד הזה בודק אם
      # כרומיום אמיתי עובר את האתגר מהראנר.
      - name: Open one url in a real browser
        if: inputs.browser != ''
        env:
          TARGET: ${{ inputs.browser }}
        run: |
          python - <<'EOF'
          import os, time
          from playwright.sync_api import sync_playwright
          url = os.environ['TARGET']
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page(locale='he-IL')
              r = pg.goto(url, wait_until='domcontentloaded', timeout=90000)
              print('first response:', r.status if r else '-')
              # דף האתגר מחליף את עצמו אחרי שניות ספורות כשהוא עובר.
              for i in range(6):
                  time.sleep(5)
                  html = pg.content()
                  cards = html.count('s_career')
                  print(f'  t+{(i+1)*5:>2}s  title={pg.title()[:45]!r}  '
                        f'{len(html):>8} bytes  s_career={cards}')
                  if cards:
                      break
              b.close()
          EOF

      # מריץ את כל שערי הסינון על מקור אחד ומדפיס מי פסל מה. קריאה בלבד:
      # אין מסד, אין seen_jobs, אין הודעות.
      - name: Run the filters over one source
        if: inputs.gates != ''
        env:
          GATES: ${{ inputs.gates }}
        run: |
          set -o pipefail
          python run_notify.py gates "$GATES" 2>&1 | tee gates.txt || true
          {
            echo '## Gates'
            echo '```'
            cat gates.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Probe
        if: inputs.sample == '' && inputs.gates == ''
        env:
          WHICH: ${{ inputs.which }}
        run: |
          set -o pipefail
          python probe_broken.py $WHICH 2>&1 | tee probe.txt || true
          {
            echo '## Probe'
            echo '```'
            cat probe.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
