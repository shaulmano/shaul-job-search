name: Probe broken sources

# SQLink and One1 answer from a GitHub runner and not from anywhere else a fix
# can be written, so the probe runs here and prints what the pages return today.
# Manual only, read-only, and it notifies nobody.
on:
  workflow_dispatch:
    inputs:
      which:
        description: 'sqlink, one1, or both (space separated)'
        required: false
        default: 'sqlink one1'
      sample:
        description: 'instead, print what one source returns raw: "<source> <role>"'
        required: false
        default: ''
      gates:
        description: 'instead, run every filter over one source and print who dropped what'
        required: false
        default: ''
      fingerprint:
        description: 'instead, try several browser fingerprints against one url and print the status of each'
        required: false
        default: ''

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # מדפיס מה מקור מחזיר לפני כל שער. GotFriends ו-Nisha נראים כמו מקור
      # שעובד ומחזירים שורות, וכל אחת מהן נופלת בשער התחום.
      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml curl_cffi playwright tzdata

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Sample one source
        if: inputs.sample != '' && inputs.gates == ''
        env:
          SAMPLE: ${{ inputs.sample }}
        run: |
          set -o pipefail
          python run_notify.py sample $SAMPLE 2>&1 | tee sample.txt || true
          {
            echo '## Sample'
            echo '```'
            cat sample.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 14.11.2026. מלם־תים הפסיק להביא משרות ב-1.11 ומחזיר מהראנר
      # HTTP 403 עם "Just a moment...", כלומר Cloudflare. כל הסקרייפרים
      # מתחזים ל-chrome124, שהוא כרום מאפריל 2024, ו-Cloudflare מהדקת את
      # הטביעה מול דפדפנים ישנים. הצעד הזה בודק אם טביעה עדכנית עוברת,
      # לפני שמחזירים מקור למחשב של שאול בניגוד להעדפה שלו.
      - name: Try browser fingerprints against one url
        if: inputs.fingerprint != ''
        env:
          TARGET: ${{ inputs.fingerprint }}
        run: |
          python - <<'EOF'
          import os
          from curl_cffi import requests as cf
          url = os.environ['TARGET']
          try:
              from curl_cffi.requests.impersonate import BrowserTypeLiteral
              print('available:', BrowserTypeLiteral)
          except Exception:
              pass
          for target in ['chrome124', 'chrome131', 'chrome133a', 'chrome136',
                         'chrome', 'safari18_0', 'firefox135']:
              try:
                  r = cf.get(url, impersonate=target, timeout=60)
                  title = ''
                  if 'text/html' in r.headers.get('content-type', ''):
                      body = r.text[:4000]
                      i = body.lower().find('<title')
                      if i >= 0:
                          j = body.find('>', i); k = body.lower().find('</title', j)
                          title = body[j+1:k].strip()[:50]
                  print(f'{target:14} HTTP {r.status_code}  {len(r.content):>9} bytes  {title}')
              except Exception as e:
                  print(f'{target:14} failed: {str(e)[:90]}')
          EOF

      # מריץ את כל שערי הסינון על מקור אחד ומדפיס מי פסל מה. קריאה בלבד:
      # אין מסד, אין seen_jobs, אין הודעות.
      - name: Run the filters over one source
        if: inputs.gates != ''
        env:
          GATES: ${{ inputs.gates }}
        run: |
          set -o pipefail
          python run_notify.py gates "$GATES" 2>&1 | tee gates.txt || true
          {
            echo '## Gates'
            echo '```'
            cat gates.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Probe
        if: inputs.sample == '' && inputs.gates == ''
        env:
          WHICH: ${{ inputs.which }}
        run: |
          set -o pipefail
          python probe_broken.py $WHICH 2>&1 | tee probe.txt || true
          {
            echo '## Probe'
            echo '```'
            cat probe.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
