name: Backfill job descriptions

# האיסוף בזמן הסריקה חל רק על משרות חדשות. המשרות שכבר היו בקובץ נשארו בלי
# תיאור, ובלעדיו המסך נראה בדיוק כמו קודם וייצור קורות חיים עדיין דורש
# הדבקה ידנית. זה ממלא אותן אחורה, מהחדשות לישנות.
#
# ידני, כי זאת פעולה חד פעמית ברובה. אחרי שהפער נסגר, הסריקה הרגילה מספיקה.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'How many job pages to fetch (each one is a request to the board)'
        required: false
        default: '25'

concurrency:
  group: job-search-notify     # אותה קבוצה כמו הסריקה: שניהם כותבים jobs.jsonl
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml curl_cffi playwright tzdata

      - name: Fill in the missing descriptions
        run: python run_notify.py backfill "${{ inputs.limit }}"

      - name: Publish jobs.jsonl
        id: publish
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add jobs.jsonl
          if git diff --cached --quiet -- jobs.jsonl; then
            echo "jobs=unchanged" >> "$GITHUB_OUTPUT"
          else
            echo "jobs=changed" >> "$GITHUB_OUTPUT"
            git commit -m "Backfill job descriptions"
            git pull --rebase --autostash
            git push
          fi

      # אותו מסלול שהסריקה משתמשת בו: בלי זה התיאורים יושבים בקובץ ולא מגיעים
      # למסד עד הסנכרון המתוזמן הבא.
      - name: Wake the situation room
        if: steps.publish.outputs.jobs == 'changed'
        env:
          SR_SYNC_TOKEN: ${{ secrets.SR_SYNC_TOKEN }}
        run: |
          if [ -z "$SR_SYNC_TOKEN" ]; then
            echo "SR_SYNC_TOKEN not set - the situation room will pick this up on its own schedule"
            exit 0
          fi
          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $SR_SYNC_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/shaulmano/situation-room/actions/workflows/sync.yml/dispatches \
            -d '{"ref":"main"}')
          if [ "$code" = "204" ]; then
            echo "situation room sync dispatched"
          else
            echo "::warning::dispatch returned HTTP $code - $(cat /tmp/dispatch.out)"
          fi
