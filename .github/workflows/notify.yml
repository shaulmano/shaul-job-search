name: Job Search Notify

on:
  schedule:
    - cron: '0 * * * *'      # every hour, on the hour (UTC)
  workflow_dispatch:         # allow manual trigger from GitHub

# Each run commits seen_jobs.json + the HTML snapshot, so runs must never
# overlap — a delayed run must queue behind the previous one, not race it.
concurrency:
  group: job-search-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml curl_cffi playwright

      # gotfriends, sqlink, dialog and nisha are scraped through a real browser.
      # Nisha in particular is where most on-target QA management roles come from.
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run notify
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_notify.py

      - name: Publish jobs.html + seen_jobs.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs seen_jobs.json
          git diff --cached --quiet || git commit -m "Update jobs.html + seen_jobs.json"
          git pull --rebase --autostash
          git push
