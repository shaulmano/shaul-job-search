name: Job Search Notify

on:
  schedule:
    # Every 90 minutes. Paging LinkedIn took the request count per scan from 9
    # to 45, and its guest endpoint meters on a rolling window — hourly sat
    # permanently at the limit. 90 minutes is 16 runs a day instead of 24, so
    # 720 LinkedIn requests instead of 1080, with real recovery time between
    # bursts. Nothing is lost to the slower cadence: sources are asked for the
    # last 36 hours, so the overlap is 24x.
    #
    # cron has no "every 90 minutes", so it takes two entries: the pattern
    # repeats every 3 hours, on the hour and then on the half hour.
    # 2.11.2026: GitHub לא מריץ את רוב הריצות המתוזמנות. באותו יום יצאו לדרך
    # שלוש מתוך שש עשרה, ובין 12:24 ל-18:19 לא רצה אף אחת. הן לא נכשלו ולא
    # בוטלו, הן פשוט לא התחילו, וזאת התנהגות ידועה של cron ב-Actions תחת עומס.
    #
    # לכן מבקשים כל חצי שעה במקום כל 90 דקות. המרווח האמיתי נשמר בצעד
    # "Space the runs" למטה, שמפסיק ריצה שיצאה פחות מ-80 דקות אחרי הקודמת.
    # כך העומס על המקורות, ובכלל זה חלון הבקשות המתגלגל של לינקדאין שבגללו
    # נקבעו 90 הדקות, נשאר בדיוק כשהיה, ורק הסיכוי שריצה תתחיל עולה.
    - cron: '0,30 * * * *'
  workflow_dispatch:         # allow manual trigger from GitHub

# Each run commits seen_jobs.json + the HTML snapshot, so runs must never
# overlap — a delayed run must queue behind the previous one, not race it.
concurrency:
  group: job-search-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      # שומר המרווח. הקרון מבקש כל חצי שעה כדי לנצח את הדילוגים של GitHub,
      # והצעד הזה הוא מה שמוודא שהסריקה עצמה עדיין יוצאת כל 80 דקות לפחות.
      #
      # המדידה היא מול הריצה המוצלחת האחרונה של הוורקפלו הזה לפי GitHub עצמו,
      # ולא מול קובץ במאגר: ריצה שלא מצאה כלום לא מחייבת קומיט, ולכן תאריך
      # קומיט אינו עדות למתי נסרק.
      #
      # הפעלה ידנית לעולם לא נחסמת. כשמריצים בכוונה, רוצים שזה ירוץ.
      - name: Space the runs
        id: spacing
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, urllib.request
          from datetime import datetime, timezone

          MIN_MINUTES = 80
          url = (f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
                 "/actions/workflows/notify.yml/runs"
                 "?status=success&event=schedule&per_page=1")
          req = urllib.request.Request(url, headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
          })
          try:
              runs = json.load(urllib.request.urlopen(req, timeout=20))['workflow_runs']
          except Exception as e:
              # ספק לטובת הסריקה: אם אי אפשר לדעת מתי רצה הקודמת, רצים.
              print("skip=no")
              print(f"note=could not read run history: {e}")
              raise SystemExit(0)

          if not runs:
              print("skip=no")
              raise SystemExit(0)

          started = datetime.strptime(runs[0]['created_at'], '%Y-%m-%dT%H:%M:%SZ')
          started = started.replace(tzinfo=timezone.utc)
          mins = (datetime.now(timezone.utc) - started).total_seconds() / 60
          print(f"skip={'yes' if mins < MIN_MINUTES else 'no'}")
          print(f"since={mins:.0f}")
          PY

      - name: Nothing to do yet
        if: steps.spacing.outputs.skip == 'yes'
        run: echo "last scan ran ${{ steps.spacing.outputs.since }} minutes ago - keeping the 80 minute spacing"

      - uses: actions/setup-python@v5
        if: steps.spacing.outputs.skip != 'yes'
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.spacing.outputs.skip != 'yes'
        run: pip install requests beautifulsoup4 lxml curl_cffi playwright tzdata

      # gotfriends, sqlink, dialog and nisha are scraped through a real browser.
      # Nisha in particular is where most on-target QA management roles come from.
      - name: Install Chromium
        if: steps.spacing.outputs.skip != 'yes'
        run: python -m playwright install --with-deps chromium

      - name: Run notify
        if: steps.spacing.outputs.skip != 'yes'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_notify.py

      # jobs.jsonl travels with the other two: the runner is thrown away after
      # each run, so anything not committed here is lost, and the job records
      # are what a Telegram button will resolve against later.
      - name: Publish jobs.html + seen_jobs.json + jobs.jsonl
        if: steps.spacing.outputs.skip != 'yes'
        id: publish
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs seen_jobs.json jobs.jsonl secretjobs_snapshot.json
          # Only jobs.jsonl matters downstream. docs/ and the snapshot change on
          # runs that found nothing new, and waking the situation room for those
          # would spend two minutes of its private-repo quota to copy nothing.
          if git diff --cached --quiet -- jobs.jsonl; then
            echo "jobs=unchanged" >> "$GITHUB_OUTPUT"
          else
            echo "jobs=changed" >> "$GITHUB_OUTPUT"
          fi
          git diff --cached --quiet || git commit -m "Update jobs.html + seen_jobs.json + jobs.jsonl + secretjobs snapshot"
          git pull --rebase --autostash
          git push

      # Tell the situation room the file moved instead of leaving it to find out.
      #
      # It used to find out on its own schedule, and GitHub's cron is best-effort:
      # on 09/09 the syncs due at 16:20 and 17:50 never ran, so postings sat in
      # jobs.jsonl for three hours while Telegram already had them. That gap is
      # not a bug anywhere — it is the cost of polling something that can just
      # say when it changed.
      #
      # The token is deliberately not the one this repo is not allowed to hold.
      # It grants exactly one thing: start a workflow on situation-room. It
      # cannot read the database, cannot read the repository, and reaches no
      # other repo. A secret here is never exposed to a pull request from a
      # fork — only to workflows on the default branch, which only Shaul pushes.
      #
      # Absent, this step says so and exits clean: the scheduled sync is still
      # there as a floor, so a missing or expired token costs latency, not data.
      - name: Wake the situation room
        if: steps.spacing.outputs.skip != 'yes' && steps.publish.outputs.jobs == 'changed'
        env:
          SR_SYNC_TOKEN: ${{ secrets.SR_SYNC_TOKEN }}
        run: |
          if [ -z "$SR_SYNC_TOKEN" ]; then
            echo "SR_SYNC_TOKEN not set - the situation room will pick this up on its own schedule"
            exit 0
          fi
          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST             -H "Authorization: Bearer $SR_SYNC_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             https://api.github.com/repos/shaulmano/situation-room/actions/workflows/sync.yml/dispatches             -d '{"ref":"main"}')
          if [ "$code" = "204" ]; then
            echo "situation room sync dispatched"
          else
            # Not a failure of the scan. Say it loudly and let the run pass.
            echo "::warning::dispatch returned HTTP $code - $(cat /tmp/dispatch.out)"
          fi
